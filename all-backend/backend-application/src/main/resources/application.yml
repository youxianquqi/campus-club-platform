# 主配置文件 - 直接配置，无环境变量
# 栈：JDK 17、Spring Boot 3.2.12、MyBatis-Plus 3.5.6、MySQL 8.0、Redis 7.0

server:
  port: 8080

spring:
  application:
    name: endtiem
  profiles:
    active: dev
  web:
    resources:
      static-locations: classpath:/static/
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://localhost:3306/club_home?useUnicode=true&characterEncoding=utf-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root_sea
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      username:
      password:
      database: 0
      timeout: 3s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
          max-wait: 3s
        shutdown-timeout: 100ms
      client-name: endtiem-backend

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.endtiem.admin.entity,com.endtiem.recruitment.entity,com.endtiem.club.entity,com.endtiem.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

jwt:
  secret: your_super_secret_jwt_key_minimum_32_characters_here
  expire-ms: 3600000

file:
  upload:
    path: /www/wwwroot/endtiem-uploads/

ai:
  api:
    # 通过环境变量 DEEPSEEK_API_KEY 注入，请勿在仓库中提交真实密钥
    key: ${DEEPSEEK_API_KEY:}
    url: https://api.deepseek.com/v1/chat/completions
    model: deepseek-chat
  summary:
    allow-local-fallback: true

logging:
  level:
    root: INFO
    com.endtiem: INFO
